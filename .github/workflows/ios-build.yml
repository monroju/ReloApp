name: Build iOS Simulator App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail

          xcodebuild build \
            -scheme ReloApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -A2 "error:" build.log || echo "No error lines found"
          echo "=== WARNINGS ==="
          grep "warning:" build.log | head -20 || echo "No warnings"

      - name: Zip .app bundle for Appetize.io
        run: |
          APP_PATH=$(find build/derivedData/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            find build/derivedData/Build/Products -type d | head -20
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/ReloApp-Simulator.zip" "$(basename "$APP_PATH")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReloApp-Simulator
          path: ReloApp-Simulator.zip
          retention-days: 30
