name: Build iOS Simulator App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # List available Xcode versions for debugging
          ls /Applications/ | grep Xcode
          # Pick an Xcode 26 that actually exists on the runner. The GitHub image
          # ships versioned bundles (Xcode_26.0.app, Xcode_26.1.app, ...) and the
          # exact set drifts, so resolve dynamically: prefer newest 26.0.x, then
          # newest 26.x, then the default Xcode.app. (iOS 26 SDK required by the
          # App Store from 2026-04-28.)
          XC=$(ls -d /Applications/Xcode_26.0*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=/Applications/Xcode.app
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GoThere.xcodeproj \
            -scheme GoThere

      - name: Build for iOS Simulator
        run: |
          set -o pipefail

          # Find an available iPhone simulator
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid']); sys.exit(0)
          ")
          echo "Using simulator: $UDID"

          xcodebuild build \
            -project GoThere.xcodeproj \
            -scheme GoThere \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -configuration Debug \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -A2 "error:" build.log 2>/dev/null || echo "No error lines found"

      - name: Run unit tests (non-blocking)
        # Differentiation Wave added XCTest suites (DocumentVault, CitaMonitor,
        # CoPilotEngine, MoveProfileStore). Non-blocking for now so simulator
        # flakiness doesn't mask a green build; promote to blocking once stable.
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid']); sys.exit(0)
          ")
          echo "Testing on simulator: $UDID"
          xcodebuild test \
            -project GoThere.xcodeproj \
            -scheme GoThere \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -configuration Debug \
            -only-testing:GoThereTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Zip .app bundle for Appetize.io
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            find build/derivedData/Build/Products -type f -o -type d | head -30
            exit 1
          fi
          echo "=== App bundle ==="
          ls -la "$APP_PATH"
          echo "=== Info.plist ==="
          cat "$APP_PATH/Info.plist" 2>/dev/null || plutil -p "$APP_PATH/Info.plist"

          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/GoThere-Simulator.zip" "$(basename "$APP_PATH")"
          echo "=== Zip size ==="
          ls -lh "$GITHUB_WORKSPACE/GoThere-Simulator.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoThere-Simulator
          path: GoThere-Simulator.zip
          retention-days: 30
