name: Build iOS Simulator App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and install iOS platform
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          xcodebuild -downloadPlatform iOS

      - name: Create simulator if needed
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -i "ios" | tail -1 | awk '{print $NF}')
          echo "Using runtime: $RUNTIME"

          if ! xcrun simctl list devices available | grep -qi iphone; then
            xcrun simctl create "MyiPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME"
          fi

          UDID=$(xcrun simctl list devices available | grep -i iphone | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Build for iOS Simulator
        run: |
          set -o pipefail

          xcodebuild build \
            -scheme ReloApp \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            2>&1 | tee build.log

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -A2 "error:" build.log 2>/dev/null || echo "No error lines found"
          echo "=== WARNINGS ==="
          grep "warning:" build.log 2>/dev/null | head -20 || echo "No warnings"

      - name: Package .app bundle for Appetize.io
        run: |
          PRODUCTS="build/derivedData/Build/Products/Debug-iphonesimulator"
          BINARY="$PRODUCTS/ReloApp"

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found at $BINARY"
            find build/derivedData/Build/Products -type f | head -20
            exit 1
          fi

          # SPM executables don't produce .app bundles, so we build one manually
          APP_DIR="$PRODUCTS/ReloApp.app"
          mkdir -p "$APP_DIR"
          cp "$BINARY" "$APP_DIR/ReloApp"

          # Create Info.plist required for .app bundle
          cat > "$APP_DIR/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ReloApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.reloapp.app</string>
              <key>CFBundleName</key>
              <string>ReloApp</string>
              <key>CFBundleDisplayName</key>
              <string>ReloApp</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneSimulator</string>
              </array>
              <key>MinimumOSVersion</key>
              <string>18.0</string>
              <key>DTPlatformName</key>
              <string>iphonesimulator</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          PLIST

          echo "Created .app bundle at: $APP_DIR"
          ls -la "$APP_DIR"

          cd "$PRODUCTS"
          zip -r "$GITHUB_WORKSPACE/ReloApp-Simulator.zip" ReloApp.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReloApp-Simulator
          path: ReloApp-Simulator.zip
          retention-days: 30
