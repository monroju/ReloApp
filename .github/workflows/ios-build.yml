name: Build iOS Simulator App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install iOS Simulator runtime
        run: |
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GoThere.xcodeproj \
            -scheme GoThere

      - name: Build for iOS Simulator
        run: |
          set -o pipefail

          # Find an available iPhone simulator
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid']); sys.exit(0)
          " 2>/dev/null || true)

          if [ -n "$DEST" ]; then
            echo "Using simulator: $DEST"
            DESTINATION="id=$DEST"
          else
            echo "No specific simulator found, using generic"
            DESTINATION="generic/platform=iOS Simulator"
          fi

          xcodebuild build \
            -project GoThere.xcodeproj \
            -scheme GoThere \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -A2 "error:" build.log 2>/dev/null || echo "No error lines found"

      - name: Zip .app bundle for Appetize.io
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            find build/derivedData/Build/Products -type f -o -type d | head -30
            exit 1
          fi
          echo "=== App bundle ==="
          ls -la "$APP_PATH"
          echo "=== Info.plist ==="
          cat "$APP_PATH/Info.plist" 2>/dev/null || plutil -p "$APP_PATH/Info.plist"

          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/GoThere-Simulator.zip" "$(basename "$APP_PATH")"
          echo "=== Zip size ==="
          ls -lh "$GITHUB_WORKSPACE/GoThere-Simulator.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoThere-Simulator
          path: GoThere-Simulator.zip
          retention-days: 30
