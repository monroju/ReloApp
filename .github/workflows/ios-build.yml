name: Build iOS Simulator App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and install iOS platform
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          xcodebuild -downloadPlatform iOS

      - name: Create simulator if needed
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -i "ios" | tail -1 | awk '{print $NF}')
          if ! xcrun simctl list devices available | grep -qi iphone; then
            xcrun simctl create "MyiPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME"
          fi
          UDID=$(xcrun simctl list devices available | grep -i iphone | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme ReloApp \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            2>&1 | tee build.log

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -A2 "error:" build.log 2>/dev/null || echo "No error lines found"
          echo "=== WARNINGS ==="
          grep "warning:" build.log 2>/dev/null | head -20 || echo "No warnings"

      - name: Package .app bundle for Appetize.io
        run: |
          PRODUCTS="build/derivedData/Build/Products/Debug-iphonesimulator"
          BINARY="$PRODUCTS/ReloApp"

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found"
            find build/derivedData/Build/Products -type f | head -20
            exit 1
          fi

          # Create .app bundle structure
          APP_DIR="$PRODUCTS/ReloApp.app"
          mkdir -p "$APP_DIR/Frameworks"
          cp "$BINARY" "$APP_DIR/ReloApp"

          # Copy any Swift frameworks the binary depends on
          if [ -d "$PRODUCTS/PackageFrameworks" ]; then
            cp -R "$PRODUCTS/PackageFrameworks/"*.framework "$APP_DIR/Frameworks/" 2>/dev/null || true
          fi

          # Create PkgInfo
          echo -n "APPL????" > "$APP_DIR/PkgInfo"

          # Create Info.plist (no leading whitespace)
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string ReloApp" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.reloapp.app" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string ReloApp" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ReloApp" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.0" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms:0 string iPhoneSimulator" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 18.0" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :DTPlatformName string iphonesimulator" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :DTSDKName string iphonesimulator18.2" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeRight" "$APP_DIR/Info.plist"

          # Verify
          echo "=== App bundle contents ==="
          ls -la "$APP_DIR"
          echo "=== Info.plist ==="
          cat "$APP_DIR/Info.plist"
          echo "=== Binary info ==="
          file "$APP_DIR/ReloApp"
          lipo -info "$APP_DIR/ReloApp"

          # Zip
          cd "$PRODUCTS"
          zip -r "$GITHUB_WORKSPACE/ReloApp-Simulator.zip" ReloApp.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReloApp-Simulator
          path: ReloApp-Simulator.zip
          retention-days: 30
