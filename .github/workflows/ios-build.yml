name: iOS 18 Build & Logic Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build for iOS Simulator
        run: xcodebuild build -scheme ReloApp -destination 'platform=iOS Simulator,name=iPhone 16'
