name: Build iOS Simulator App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and install iOS platform
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

          # Download iOS simulator runtime
          xcodebuild -downloadPlatform iOS

          # Debug: show what simulators are available
          echo "=== Available runtimes ==="
          xcrun simctl list runtimes
          echo "=== Available iPhone devices ==="
          xcrun simctl list devices available | grep -i iphone || echo "No iPhone devices found"

      - name: Create simulator if needed
        run: |
          # Create a simulator device if none exists
          RUNTIME=$(xcrun simctl list runtimes | grep -i "ios" | tail -1 | awk '{print $NF}')
          echo "Using runtime: $RUNTIME"

          if ! xcrun simctl list devices available | grep -qi iphone; then
            echo "No iPhone simulator found, creating one..."
            xcrun simctl create "MyiPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME"
          fi

          # Get the device UDID
          UDID=$(xcrun simctl list devices available | grep -i iphone | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          echo "Using simulator UDID: $UDID"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail

          xcodebuild build \
            -scheme ReloApp \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            2>&1 | tee build.log

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -A2 "error:" build.log 2>/dev/null || echo "No error lines found in build.log"
          echo "=== WARNINGS ==="
          grep "warning:" build.log 2>/dev/null | head -20 || echo "No warnings"

      - name: Zip .app bundle for Appetize.io
        run: |
          APP_PATH=$(find build/derivedData/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            find build/derivedData/Build/Products -type d | head -20
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/ReloApp-Simulator.zip" "$(basename "$APP_PATH")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReloApp-Simulator
          path: ReloApp-Simulator.zip
          retention-days: 30
