name: Build iOS Simulator App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          # List available Xcode versions for debugging
          ls /Applications/ | grep Xcode
          # Use Xcode 16.1 (available on macos-14, has Swift 6 + iOS 18.1 simulator)
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GoThere.xcodeproj \
            -scheme GoThere

      - name: Build for iOS Simulator
        run: |
          set -o pipefail

          # Find an available iPhone simulator
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid']); sys.exit(0)
          ")
          echo "Using simulator: $UDID"

          xcodebuild build \
            -project GoThere.xcodeproj \
            -scheme GoThere \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -configuration Debug \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -A2 "error:" build.log 2>/dev/null || echo "No error lines found"

      - name: Zip .app bundle for Appetize.io
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            find build/derivedData/Build/Products -type f -o -type d | head -30
            exit 1
          fi
          echo "=== App bundle ==="
          ls -la "$APP_PATH"
          echo "=== Info.plist ==="
          cat "$APP_PATH/Info.plist" 2>/dev/null || plutil -p "$APP_PATH/Info.plist"

          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/GoThere-Simulator.zip" "$(basename "$APP_PATH")"
          echo "=== Zip size ==="
          ls -lh "$GITHUB_WORKSPACE/GoThere-Simulator.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoThere-Simulator
          path: GoThere-Simulator.zip
          retention-days: 30
