workflows:
  ios-simulator-build:
    name: Build iOS Simulator App
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0
      vars:
        XCODE_PROJECT: "GoThere.xcodeproj"
        XCODE_SCHEME: "GoThere"
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run unit tests (non-blocking)
        # Foundation Wave 1 introduces XCTest. First 1-2 builds keep this
        # non-blocking while we shake out the simulator destination + signing
        # config; promote to blocking once green.
        ignore_failure: true
        script: |
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -only-testing:GoThereTests

      - name: Package for Appetize.io
        script: |
          APP_PATH=$(find build/derivedData/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
          echo "Found: $APP_PATH"
          ls -la "$APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$CM_BUILD_DIR/GoThere-Simulator.zip" "$(basename "$APP_PATH")"
          ls -lh "$CM_BUILD_DIR/GoThere-Simulator.zip"

    artifacts:
      - "*.zip"

  ios-appstore-build:
    name: Build & Publish to App Store Connect
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0
      groups:
        - ios_signing
        - app_store
      vars:
        XCODE_PROJECT: "GoThere.xcodeproj"
        XCODE_SCHEME: "GoThere"
        BUNDLE_ID: "com.gothere.ios"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Set up code signing manually
        script: |
          #!/bin/bash
          set -e

          # Create keychain
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          KEYCHAIN_PASSWORD="temppassword123"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Decode and import certificate
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and install provisioning profile
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/gothere_appstore.mobileprovision"

          # Get profile UUID
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$PROFILE_DIR/gothere_appstore.mobileprovision"))
          echo "Profile UUID: $PROFILE_UUID"
          cp "$PROFILE_DIR/gothere_appstore.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          # Export for later steps
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV

          # Verify
          echo "Installed profiles:"
          ls -la "$PROFILE_DIR/"
          echo "Keychain identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Increment build number
        script: |
          # Use max(ASC latest TF build, git commit count) + 1 so we always go higher.
          # Plain `get-latest-testflight-build-number` returned empty for build #39
          # (2026-05-20), making NEW_BUILD collide with a stale bundleVersion=1 on ASC.
          # Commit count is monotonic on the branch, so it's the safe floor.
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --platform IOS 2>/dev/null || echo 0)
          LATEST_BUILD=${LATEST_BUILD:-0}
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if [ "$LATEST_BUILD" -lt "$COMMIT_COUNT" ]; then
            LATEST_BUILD=$COMMIT_COUNT
          fi
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "ASC latest: ${LATEST_BUILD} | commit count: ${COMMIT_COUNT} | using: ${NEW_BUILD}"
          cd "$CM_BUILD_DIR"
          agvtool new-version -all $NEW_BUILD

      - name: Build for App Store
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/GoThere.xcarchive

      - name: Create ExportOptions.plist and export IPA
        script: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>method</key>
          <string>app-store</string>
          <key>teamID</key>
          <string>PN45FJSNW2</string>
          <key>uploadBitcode</key>
          <false/>
          <key>uploadSymbols</key>
          <true/>
          <key>provisioningProfiles</key>
          <dict>
          <key>com.gothere.ios</key>
          <string>$PROFILE_UUID</string>
          </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/GoThere.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ios/ipa

      - name: Upload to App Store Connect
        script: |
          # Find the IPA
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # Upload using Codemagic's app-store-connect CLI
          app-store-connect publish \
            --path "$IPA_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/GoThere.xcarchive
