workflows:
  ios-simulator-build:
    name: Build iOS Simulator App
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
      vars:
        XCODE_PROJECT: "GoThere.xcodeproj"
        XCODE_SCHEME: "GoThere"
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package for Appetize.io
        script: |
          APP_PATH=$(find build/derivedData/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
          echo "Found: $APP_PATH"
          ls -la "$APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$CM_BUILD_DIR/GoThere-Simulator.zip" "$(basename "$APP_PATH")"
          ls -lh "$CM_BUILD_DIR/GoThere-Simulator.zip"

    artifacts:
      - "*.zip"
