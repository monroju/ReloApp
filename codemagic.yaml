workflows:
  ios-simulator-build:
    name: Build iOS Simulator App
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 15.4
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate
          # Fix objectVersion for Xcode 15 compat
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/' ReloApp.xcodeproj/project.pbxproj

      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project ReloApp.xcodeproj \
            -scheme ReloApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package for Appetize.io
        script: |
          APP_PATH=$(find build/derivedData/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
          cd "$(dirname "$APP_PATH")"
          zip -r "$CM_BUILD_DIR/ReloApp-Simulator.zip" "$(basename "$APP_PATH")"

    artifacts:
      - "*.zip"
