workflows:
  ios-simulator-build:
    name: Build iOS Simulator App
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0
      groups:
        # Codemagic env group "APPETIZE" must define:
        #   APPETIZE_TOKEN       (required) — Appetize API token, from appetize.io account settings
        #   APPETIZE_PUBLIC_KEY  (optional) — pin updates to one app/URL; if unset, a new app is
        #                                     created and its publicKey printed in the log to save here.
        - APPETIZE
      vars:
        XCODE_PROJECT: "GoThere.xcodeproj"
        XCODE_SCHEME: "GoThere"
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run unit tests (non-blocking)
        # Foundation Wave 1 introduces XCTest. First 1-2 builds keep this
        # non-blocking while we shake out the simulator destination + signing
        # config; promote to blocking once green.
        ignore_failure: true
        script: |
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -only-testing:GoThereTests

      - name: Package for Appetize.io
        script: |
          APP_PATH=$(find build/derivedData/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
          echo "Found: $APP_PATH"
          ls -la "$APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$CM_BUILD_DIR/GoThere-Simulator.zip" "$(basename "$APP_PATH")"
          ls -lh "$CM_BUILD_DIR/GoThere-Simulator.zip"

      - name: Deploy to Appetize.io
        # Auto-publishes the simulator build to Appetize. Skips cleanly if no token is set.
        # Update-in-place when APPETIZE_PUBLIC_KEY is provided; otherwise create + print the key.
        script: |
          ZIP="$CM_BUILD_DIR/GoThere-Simulator.zip"
          if [ -z "$APPETIZE_TOKEN" ]; then
            echo "APPETIZE_TOKEN not set — skipping Appetize deploy (add it to the 'appetize' env group)."
            exit 0
          fi
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then
            echo "Updating existing Appetize app $APPETIZE_PUBLIC_KEY ..."
            URL="https://${APPETIZE_TOKEN}@api.appetize.io/v1/apps/${APPETIZE_PUBLIC_KEY}"
          else
            echo "No APPETIZE_PUBLIC_KEY — creating a new Appetize app (save the printed publicKey)..."
            URL="https://${APPETIZE_TOKEN}@api.appetize.io/v1/apps"
          fi
          RESP=$(curl -sf "$URL" -F "file=@${ZIP}" -F "platform=ios") || {
            echo "Appetize upload failed"; echo "$RESP"; exit 1; }
          echo "$RESP"
          PK=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('publicKey',''))" 2>/dev/null)
          echo "Appetize publicKey: ${PK:-$APPETIZE_PUBLIC_KEY}"
          echo "Play URL: https://appetize.io/app/${PK:-$APPETIZE_PUBLIC_KEY}"

    artifacts:
      - "*.zip"

  ios-appstore-build:
    name: Build & Publish to App Store Connect
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0
      groups:
        - ios_signing
        - app_store
      vars:
        XCODE_PROJECT: "GoThere.xcodeproj"
        XCODE_SCHEME: "GoThere"
        BUNDLE_ID: "com.gothere.ios"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Set up code signing manually
        script: |
          #!/bin/bash
          set -e

          # Create keychain
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          KEYCHAIN_PASSWORD="temppassword123"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Decode and import certificate
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and install provisioning profile
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/gothere_appstore.mobileprovision"

          # Get profile UUID
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$PROFILE_DIR/gothere_appstore.mobileprovision"))
          echo "Profile UUID: $PROFILE_UUID"
          cp "$PROFILE_DIR/gothere_appstore.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          # Export for later steps
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV

          # Verify
          echo "Installed profiles:"
          ls -la "$PROFILE_DIR/"
          echo "Keychain identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Increment build number
        script: |
          # Build-number resolution. ASC enforces uniqueness across ALL submitted
          # builds — including ones in "processing", "rejected", and "waiting for
          # review" states. Querying TestFlight alone misses those; build #51
          # collided on 2026-05-21 because TF reported 50 while the App Store
          # surface had 51 stuck in review. Fix: query both surfaces, take max.
          #
          # MIN_BUILD_NUMBER is a manual floor — bump it in this file when ASC
          # returns garbage or you want to skip a range. Treat it as the
          # "definitely higher than anything I've ever uploaded" line.
          #
          # On Codemagic the other two surfaces are unreliable: the checkout is a
          # SHALLOW clone so COMMIT_COUNT collapses to ~1, and the get-latest-*
          # queries below have been returning 0 (their errors are swallowed by
          # `|| echo 0`). That left this floor as the only real lever — at 54 it
          # produced build 55, which collided with the build 55 already uploaded
          # 2026-06-02 (409 ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE).
          # 2026-06-16: floor 55 → NEW_BUILD 56 collided again — 1.9.0 AND the
          # first 1.9.1 push both took 56, so the corrected 1.9.1 (POC notes
          # fact-check) was rejected as a duplicate and never uploaded. Highest
          # uploaded is 56, so bump floor to 56 → next upload is 57.
          # 2026-07-25: floor 56 → build 57 uploaded fine on the 1.9.2 version-bump
          # push, then the referral-loop push re-took 57 and 409'd
          # (ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE, previousBundleVersion=57).
          # Highest uploaded is 57, so bump floor to 57 → next upload is 58.
          # 2026-07-25 (later): referral build 58 uploaded OK. Highest is now 58,
          # so bump floor to 58 → next upload (doc-analysis) is 59.
          # 2026-07-25 (later still): money/insurance push supersedes the in-flight
          # doc-analysis build (cancel_previous_builds), shipping both on one build.
          # Bump floor to 59 → next upload is 60, safe whether or not 59 uploaded.
          # 2026-08-21: floor 59 -> build 60 uploaded OK and was submitted as
          # 1.9.3 (the paid->free grandfathering release). Note 1.9.2 had ALSO
          # shipped as build 60; ASC accepted the reuse only because the version
          # string differed. Highest uploaded is 60, so bump floor to 60 -> next
          # upload is 61. A second build for 1.9.3 at 60 would have 409'd.
          # (Root cause persists: the get-latest-* queries still return 0, so this
          # floor stays the only real lever until those are fixed.)
          MIN_BUILD_NUMBER=60

          LATEST_TF=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --platform IOS 2>/dev/null || echo 0)
          LATEST_TF=${LATEST_TF:-0}
          LATEST_AS=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" --platform IOS 2>/dev/null || echo 0)
          LATEST_AS=${LATEST_AS:-0}
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)

          # Take the max of all known surfaces.
          LATEST=$LATEST_TF
          [ "$LATEST_AS" -gt "$LATEST" ] && LATEST=$LATEST_AS
          [ "$COMMIT_COUNT" -gt "$LATEST" ] && LATEST=$COMMIT_COUNT
          [ "$MIN_BUILD_NUMBER" -gt "$LATEST" ] && LATEST=$MIN_BUILD_NUMBER

          NEW_BUILD=$((LATEST + 1))
          echo "ASC TF: ${LATEST_TF} | ASC App Store: ${LATEST_AS} | commits: ${COMMIT_COUNT} | min: ${MIN_BUILD_NUMBER} | using: ${NEW_BUILD}"
          cd "$CM_BUILD_DIR"
          agvtool new-version -all $NEW_BUILD

      - name: Build for App Store
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/GoThere.xcarchive

      - name: Create ExportOptions.plist and export IPA
        script: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>method</key>
          <string>app-store</string>
          <key>teamID</key>
          <string>PN45FJSNW2</string>
          <key>uploadBitcode</key>
          <false/>
          <key>uploadSymbols</key>
          <true/>
          <key>provisioningProfiles</key>
          <dict>
          <key>com.gothere.ios</key>
          <string>$PROFILE_UUID</string>
          </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/GoThere.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ios/ipa

      - name: Upload to App Store Connect
        script: |
          # Find the IPA
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # Upload using Codemagic's app-store-connect CLI
          app-store-connect publish \
            --path "$IPA_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/GoThere.xcarchive
