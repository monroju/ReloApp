name: GoThere
options:
  bundleIdPrefix: com.gothere
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.5.1"
    CURRENT_PROJECT_VERSION: "13"

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.6.0"
  posthog-ios:
    url: https://github.com/PostHog/posthog-ios.git
    from: "3.0.0"

targets:
  GoThere:
    type: application
    platform: iOS
    sources:
      - GoThere
    resources:
      - path: GoThere/Seeds
        type: folder
      - path: GoThere/wizard_config.json
      - path: GoThere/daily_tips.json
      - path: GoThere/poi
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gothere.ios
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: PN45FJSNW2
        PROVISIONING_PROFILE_SPECIFIER: "GoThere App Store Distro"
        INFOPLIST_FILE: GoThere/App/Info.plist
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: GoThere/App/GoThere.entitlements
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseStorage
      - package: posthog-ios
        product: PostHog
